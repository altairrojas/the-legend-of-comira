name: Extract Comira reference assets

on:
  push:
    branches: [main]
    paths:
      - 'docs/assets/characters/comira/comira-isometric-master-slices.zip'
      - '.github/workflows/extract-comira-reference.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and normalize Comira reference assets
        shell: bash
        run: |
          set -euo pipefail
          ZIP='docs/assets/characters/comira/comira-isometric-master-slices.zip'
          DEST='docs/assets/characters/comira/reference/isometric-master'
          TMP='.tmp-comira-extract'

          test -f "$ZIP"
          rm -rf "$TMP" "$DEST"
          mkdir -p "$TMP" "$DEST/images"
          unzip -q "$ZIP" -d "$TMP"

          test -f "$TMP/manifest.json"
          test -f "$TMP/README.md"
          test "$(find "$TMP/images" -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 10

          cp "$TMP"/images/*.webp "$DEST/images/"

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          dest = Path('docs/assets/characters/comira/reference/isometric-master')
          images = dest / 'images'
          purposes = {
            '01_isometric_views.webp': 'Canonical isometric facing/reference views for proportions, silhouette, scarf, satchel, pendant and staff.',
            '02_walk_side.webp': 'Reference for side-direction locomotion and frame timing.',
            '03_walk_diagonal.webp': 'Reference for diagonal/isometric locomotion and direction coverage.',
            '04_expressions.webp': 'Reference for facial expression vocabulary; not a runtime animation strip.',
            '05_actions.webp': 'Reference for action poses: idle/sit, jump, staff attack, heal/cast and related gameplay poses.',
            '06_vfx_light.webp': 'Reference for light-element VFX, attack glow and crystal/staff effects.',
            '07_vfx_heal_and_shadow.webp': 'Reference for healing VFX, shadow/contact footprint and related effects.',
            '08_ui_icons.webp': 'Reference for Comira-specific UI iconography and HUD portrait language.',
            '09_palette.webp': 'Canonical color-palette reference.',
            '10_sprite_technical_notes.webp': 'Reference for sprite/technical layout and implementation notes from the approved master.'
          }

          items = []
          for path in sorted(images.glob('*.webp')):
              data = path.read_bytes()
              items.append({
                  'file': f'images/{path.name}',
                  'mime_type': 'image/webp',
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'purpose': purposes[path.name],
                  'status': 'approved-reference-derived',
                  'runtime_use': 'reference-only'
              })

          manifest = {
              'character': 'Comira',
              'asset_role': 'approved-master-derived-reference-slices',
              'source_archive': '../comira-isometric-master-slices.zip (removed after extraction)',
              'storage_policy': {
                  'repository_format': 'WebP binary files committed directly to Git',
                  'reason': 'Human-reviewable, compact and cacheable; avoids Base64 overhead for extracted assets.',
                  'phaser_note': 'These slices are references, not final runtime atlases. Production directional sprites/atlases must be authored separately before gameplay use.'
              },
              'items': items
          }
          (dest / 'manifest.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme = '''# Comira isometric master — extracted reference slices

This directory contains the ten **approved reference slices** extracted from the Comira isometric master package.

## Status

- Character: **Comira**
- Role: art-direction/reference source
- Runtime status: **not final Phaser sprites**
- Repository format: WebP

## Structure

```text
isometric-master/
├── README.md
├── manifest.json
└── images/
    ├── 01_isometric_views.webp
    ├── 02_walk_side.webp
    ├── 03_walk_diagonal.webp
    ├── 04_expressions.webp
    ├── 05_actions.webp
    ├── 06_vfx_light.webp
    ├── 07_vfx_heal_and_shadow.webp
    ├── 08_ui_icons.webp
    ├── 09_palette.webp
    └── 10_sprite_technical_notes.webp
```

## Usage rules

- `01`, `02` and `03` are the primary locomotion/direction references.
- `05` is the action-pose reference.
- Expressions, VFX, UI and palette remain separate concerns.
- Do **not** load these reference slices as the final movable character.
- Before Phaser implementation, create production sprite sheets/atlases with consistent transparent frame bounds, origins/anchors, direction names and animation timing.
- `manifest.json` records MIME type, byte size, SHA-256, purpose and runtime status for every slice.
'''
          (dest / 'README.md').write_text(readme, encoding='utf-8')

          parent = Path('docs/assets/characters/comira/README.md')
          text = parent.read_text(encoding='utf-8')
          text = text.replace('Koba', 'Cova').replace('koba', 'cova')
          marker = '## Approved isometric master slices'
          if marker not in text:
              text += '''\n\n## Approved isometric master slices\n\nThe approved isometric reference package has been extracted into:\n\n`docs/assets/characters/comira/reference/isometric-master/`\n\nIt contains ten individually reviewable WebP slices plus `manifest.json`. These are reference assets only; final Phaser locomotion should use dedicated production sprite sheets/atlases derived from the approved directional references.\n'''
          parent.write_text(text, encoding='utf-8')
          PY

          rm -rf "$TMP"
          rm -f "$ZIP"
          rm -f '.github/workflows/extract-comira-reference.yml'

      - name: Commit extracted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'assets: extract and organize Comira isometric references'
          git push
