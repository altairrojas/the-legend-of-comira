name: Extract Comira package

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/extract-comira-simple.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip reference package
        run: |
          mkdir -p docs/assets/characters/comira/reference/isometric-master
          unzip -o docs/assets/characters/comira/comira-isometric-master-slices.zip -d docs/assets/characters/comira/reference/isometric-master
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/characters/comira/reference/isometric-master
          git commit -m "assets: extract Comira isometric reference package"
          git push
